<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c4a">
  <title>OTC Assistance</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #172b4d;
      background: #f3f6fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    button, input { font: inherit; }

    .chat {
      width: min(100%, 760px);
      height: min(780px, calc(100vh - 56px));
      min-height: 560px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 18px;
      box-shadow: 0 18px 55px rgb(20 42 77 / 12%);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 21px 25px;
      color: #fff;
      background: #071c4a;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 38%);
      border-radius: 13px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .header h1 { margin: 0; font-size: 19px; }
    .header p { margin: 5px 0 0; color: #c6d1e7; font-size: 13px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d9e6f5;
      font-size: 12px;
      white-space: nowrap;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #63d6a2;
      content: "";
    }

    .conversation {
      flex: 1;
      overflow-y: auto;
      padding: 27px clamp(16px, 5vw, 42px);
      scroll-behavior: smooth;
    }

    .welcome {
      margin: 0 auto 23px;
      color: #738199;
      font-size: 12px;
      text-align: center;
    }

    .message {
      max-width: min(88%, 540px);
      margin: 0 0 17px;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .message.user { margin-left: auto; justify-content: flex-end; }

    .avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e7eef8;
      color: #123b7a;
      font-size: 10px;
      font-weight: 800;
    }

    .bubble {
      padding: 12px 15px;
      border: 1px solid #e6ebf2;
      border-radius: 15px 15px 15px 4px;
      background: #f7f9fc;
      color: #263b59;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      border-color: #0c3473;
      border-radius: 15px 15px 4px 15px;
      background: #0c3473;
      color: #fff;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 0 0 22px 39px;
    }

    .quick-replies button {
      padding: 9px 13px;
      border: 1px solid #cdd8e8;
      border-radius: 999px;
      background: #fff;
      color: #123b7a;
      cursor: pointer;
      font-size: 12px;
      transition: background .15s ease, border-color .15s ease;
    }

    .quick-replies button:hover, .quick-replies button:focus-visible {
      border-color: #1b63b8;
      background: #f0f6ff;
    }

    .composer-wrap {
      padding: 16px clamp(16px, 5vw, 42px) 12px;
      border-top: 1px solid #edf0f5;
      background: #fff;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px 6px 16px;
      border: 1px solid #d8e0eb;
      border-radius: 14px;
      background: #fff;
    }

    .composer:focus-within { border-color: #1b63b8; box-shadow: 0 0 0 3px rgb(27 99 184 / 10%); }

    .composer input {
      width: 100%;
      min-width: 0;
      padding: 10px 0;
      border: 0;
      outline: 0;
      color: #172b4d;
      background: transparent;
      font-size: 14px;
    }

    .composer input::placeholder { color: #8995a8; }

    .composer button {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: #0c3473;
      color: #fff;
      cursor: pointer;
    }

    .composer button:hover { background: #14519a; }
    .composer button:focus-visible, .quick-replies button:focus-visible { outline: 3px solid #8dbdff; outline-offset: 2px; }
    .composer button svg { width: 18px; height: 18px; }

    .privacy-note {
      margin: 10px 0 0;
      color: #8490a2;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .chat { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; }
      .header { padding: 17px; }
      .status { font-size: 0; }
      .status::before { width: 9px; height: 9px; }
      .conversation { padding-top: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="OTC assistance chat">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">OTC</div>
      <div>
        <h1>OTC Assistance</h1>
        <p>Your Order-to-Cash support assistant</p>
      </div>
      <span class="status">Here to help</span>
    </header>

    <section class="conversation" id="conversation" aria-label="Conversation" aria-live="polite" aria-relevant="additions text">
      <p class="welcome">Today</p>
      <div class="message">
        <span class="avatar" aria-hidden="true">OTC</span>
        <div class="bubble">Hi! I’m your OTC Assistance chat. I can help with invoices, payments, and orders. What can I help you with today?</div>
      </div>
      <div class="quick-replies" aria-label="Suggested questions">
        <button type="button" data-question="I have a question about an invoice">Invoice help</button>
        <button type="button" data-question="I want to check a payment">Payment status</button>
        <button type="button" data-question="I need help with an order">Order support</button>
        <button type="button" data-question="I need to speak to the OTC team">Contact support</button>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chat-form">
        <input id="message-input" name="message" type="text" placeholder="Ask an OTC question..." aria-label="Your message" autocomplete="off" required>
        <button type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 3 10.8 13.2M21 3l-6.5 18-3.7-7.8L3 9.5 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="privacy-note">Please don’t include sensitive personal or payment information.</p>
    </div>
  </main>
  <script>
    const conversation = document.querySelector("#conversation");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message-input");

    function addMessage(text, sender) {
      const message = document.createElement("div");
      message.className = `message ${sender}`;

      if (sender === "assistant") {
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "OTC";
        message.append(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      message.append(bubble);
      conversation.append(message);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function getReply(question) {
      const text = question.toLowerCase();

      if (/invoice|billing|bill|credit note/.test(text)) {
        return "For invoice help, please check that the invoice number and customer or order reference match your records. If the invoice is missing or incorrect, contact your OTC team with the invoice number and a short description of the issue.";
      }
      if (/payment|paid|remittance|receipt/.test(text)) {
        return "To check a payment, compare the payment date, amount, and remittance reference with the open invoice. If it hasn’t been matched, share the remittance advice and invoice reference with your OTC team. Please don’t enter bank or card details here.";
      }
      if (/order|delivery|shipment/.test(text)) {
        return "For an order or delivery question, have your order number ready and check the latest order status with your account or customer service team. I can also help with an invoice or payment question.";
      }
      if (/contact|team|person|agent|human|speak/.test(text)) {
        return "I can’t connect you to a live agent from this chat yet. Please contact your company’s OTC support team through your usual internal support channel, and include the relevant invoice or order reference.";
      }
      return "I can help with invoice questions, payment status, and order support. Tell me which one you need, or contact your OTC support team through your usual internal support channel for account-specific help.";
    }

    function sendMessage(text) {
      const question = text.trim();
      if (!question) return;
      addMessage(question, "user");
      input.value = "";
      window.setTimeout(() => addMessage(getReply(question), "assistant"), 250);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
      input.focus();
    });

    conversation.querySelectorAll("[data-question]").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.dataset.question));
    });
  </script>
</body>
</html>
